<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift RC Store | Машинки на радіокеруванні</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🏎️ DRIFT RC STORE</h1>
        <p>Радіокеровані дрифт-машинки 1:24</p>
    </header>

    <main>
        <section class="catalog">
            <h2>Каталог товарів</h2>
            <div id="products-container" class="products-grid">
                <p>Завантаження товарів...</p>
            </div>
        </section>
    </main>

    <!-- Модальне вікно замовлення -->
    <div id="order-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3>Оформлення замовлення</h3>
            <p id="modal-product-name" style="color: #00f2fe; margin-bottom: 15px;"></p>
            
            <form id="order-form" onsubmit="sendOrder(event)">
                <input type="hidden" id="order-product">
                <input type="text" id="cust-name" placeholder="Ваше Ім'я" required>
                <input type="tel" id="cust-phone" placeholder="Номер телефону" required>
                <input type="text" id="cust-city" placeholder="Місто та № Нової Пошти" required>
                <button type="submit" class="btn-buy" style="width: 100%; margin-top: 10px;">Підтвердити замовлення</button>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 Drift RC Store. Всі права захищені.</p>
    </footer>

<script>
    const TG_CHAT_ID = '1984162843';
    const TG_BOT_TOKEN = '8504591879:AAFNv-Bga_d7eo0gCGYu5aEdbCjCB760zSG';

    // Список товарів
    const products = [
        {
            name: "RC Drift Car 1:24",
            price: "1200",
            image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_x...your_image_url_here",
            desc: "Радіокерована дрифт-машинка 1:24 (4WD)"
        }
    ];

    function loadProducts() {
        const container = document.getElementById('products-container');
        if (!container) return;
        container.innerHTML = '';

        products.forEach(prod => {
            container.innerHTML += `
                <div class="product-card">
                    <img src="${prod.image}" alt="${prod.name}">
                    <div class="product-info">
                        <h3 class="product-title">${prod.name}</h3>
                        <p class="product-desc">${prod.desc}</p>
                        <div class="product-bottom">
                            <span class="product-price">${prod.price} грн</span>
                            <button class="btn-buy" onclick="openModal('${prod.name}', '${prod.price}')">Замовити</button>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function openModal(pName, pPrice) {
        document.getElementById('order-modal').style.display = 'flex';
        document.getElementById('modal-product-name').innerText = `${pName} — ${pPrice} грн`;
        document.getElementById('order-product').value = `${pName} (${pPrice} грн)`;
    }

    function closeModal() {
        document.getElementById('order-modal').style.display = 'none';
    }

    async function sendOrder(e) {
        e.preventDefault();
        const product = document.getElementById('order-product').value;
        const name = document.getElementById('cust-name').value;
        const phone = document.getElementById('cust-phone').value;
        const city = document.getElementById('cust-city').value;

        const message = `🏎️ *НОВЕ ЗАМОВЛЕННЯ!*\n\n📦 *Товар:* ${product}\n👤 *Клієнт:* ${name}\n📞 *Тел:* ${phone}\n📍 *Доставка:* ${city}`;

        try {
            const response = await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TG_CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            });

            if (response.ok) {
                alert('Дякуємо! Замовлення успішно відправлено.');
                closeModal();
                document.getElementById('order-form').reset();
            } else {
                alert('Помилка відправки в Telegram.');
            }
        } catch (err) {
            alert('Помилка мережі. Спробуйте ще раз.');
        }
    }

    document.addEventListener("DOMContentLoaded", loadProducts);
</script>
</body>
</html>
